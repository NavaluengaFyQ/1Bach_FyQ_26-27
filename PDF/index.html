<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFs - IES Valle del Alberche</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .header-left h1 { font-size: 1.8em; margin: 0; }
        .header-sub {
            display: flex; align-items: center; gap: 8px;
            margin-top: 6px; flex-wrap: wrap;
        }
        .header-sub img {
            max-height: 28px; width: auto; border-radius: 4px;
            background: white; padding: 2px;
        }
        .header-sub .codigo { font-weight: 700; font-size: 1.1em; }
        .header-sub .texto { font-size: 1.1em; }
        .header-right img {
            max-height: 70px; max-width: 180px; object-fit: contain; display: block;
        }
        .section {
            padding: 25px 30px; margin: 15px;
            border-radius: 12px; border-left: 5px solid #a0aec0;
            background: #f7fafc;
        }
        .section h2 {
            font-size: 1.5em; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px; color: #2d3748;
        }
        .section h2 i { color: #4a5568; }

        .lista-pdfs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 10px 20px;
        }
        .pdf-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        .pdf-item:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
            transform: translateY(-2px);
        }
        .pdf-item i {
            color: #e53e3e;
            font-size: 1.3em;
            width: 22px; text-align: center;
        }
        .pdf-item a {
            text-decoration: none; color: #2d3748;
            font-weight: 500; font-size: 0.98em;
            flex: 1;
            word-break: break-word;
        }
        .pdf-item a:hover { color: #2b6cb0; text-decoration: underline; }

        .estado {
            text-align: center;
            padding: 30px 20px;
            color: #718096;
        }
        .estado i {
            font-size: 2em;
            margin-bottom: 10px;
            display: block;
            color: #a0aec0;
        }

        .footer-cierre {
            text-align: center; padding: 30px 20px 20px;
            margin-top: 10px; position: relative;
        }
        .footer-cierre::before {
            content: ''; display: block; width: 60px; height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 0 auto 20px auto; border-radius: 4px;
        }
        .footer-cierre .icono-cierre {
            font-size: 2.2em; color: #a0aec0;
            transition: all 0.3s ease; display: inline-block;
        }
        .footer-cierre .icono-cierre:hover {
            color: #667eea; transform: scale(1.15) rotate(5deg);
        }

        @media (max-width: 640px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-right { align-self: center; }
            .lista-pdfs { grid-template-columns: 1fr; }
            .section { padding: 18px 16px; margin: 10px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="header-left">
            <h1>IES Valle del Alberche</h1>
            <div class="header-sub">
                <img src="../img_comunes/Cápsula.png" width="40" height="auto" alt="">
                <span class="codigo">#PDFs</span>
                <span class="texto">Documentos de las unidades</span>
            </div>
        </div>
        <div class="header-right">
            <img src="../img_comunes/Valle del Alberche v2-Small.png" alt="Logo del centro">
        </div>
    </div>

    <div class="section">
        <h2><i class="fas fa-file-pdf"></i> Documentos PDF disponibles</h2>

        <div id="listaPDFs" class="lista-pdfs">
            <div class="estado"><i class="fas fa-spinner fa-spin"></i>Cargando documentos…</div>
        </div>

        <div class="footer-cierre">
            <div class="icono-cierre">
                <i class="fas fa-chevron-circle-down"></i>
            </div>
        </div>
    </div>

</div>

<script>
/* ============================================================
   DETECCIÓN AUTOMÁTICA DE PDFs EN LA CARPETA
   ------------------------------------------------------------
   Usa la API pública de GitHub para listar el contenido de
   esta misma carpeta. No requiere configuración: deduce el
   usuario, el repositorio y la carpeta a partir de la URL
   actual de GitHub Pages.
   ============================================================ */
(function () {

    function mostrarEstado(html) {
        document.getElementById('listaPDFs').innerHTML =
            `<div class="estado" style="grid-column: 1 / -1;">${html}</div>`;
    }

    /**
     * Deduce { usuario, repo, carpeta } a partir de la URL actual.
     *  - usuario.github.io/PDF/...              → repo = usuario.github.io
     *  - usuario.github.io/mi-repo/PDF/...      → repo = mi-repo
     */
    function obtenerInfoRepo() {
        const host = window.location.hostname;

        if (!host.endsWith('.github.io')) return null;
        const usuario = host.replace('.github.io', '');

        // Partes de la ruta, sin cadenas vacías
        let partes = decodeURIComponent(window.location.pathname)
            .split('/')
            .filter(Boolean);

        // Si el último elemento es un archivo (p.ej. index.html), lo quitamos
        if (partes.length && partes[partes.length - 1].includes('.')) {
            partes.pop();
        }

        if (partes.length === 0) return null;

        const carpeta = partes[partes.length - 1];

        // Si hay algo antes de la carpeta, es el nombre del repositorio;
        // si no, el repositorio es el propio usuario.github.io
        const repo = partes.length >= 2
            ? partes[partes.length - 2]
            : `${usuario}.github.io`;

        return { usuario, repo, carpeta };
    }

    async function cargarPDFs() {
        const info = obtenerInfoRepo();
        if (!info) {
            mostrarEstado('<i class="fas fa-exclamation-triangle"></i>No se pudo determinar el repositorio de GitHub.');
            return;
        }

        const url = `https://api.github.com/repos/${info.usuario}/${info.repo}/contents/${encodeURIComponent(info.carpeta)}`;

        try {
            const resp = await fetch(url, {
                headers: { 'Accept': 'application/vnd.github+json' }
            });

            if (!resp.ok) {
                if (resp.status === 404) {
                    mostrarEstado('<i class="fas fa-folder-open"></i>No se encontró la carpeta en el repositorio.');
                } else if (resp.status === 403) {
                    mostrarEstado('<i class="fas fa-hourglass-half"></i>Demasiadas peticiones a GitHub. Vuelve a intentarlo en unos minutos.');
                } else {
                    mostrarEstado(`<i class="fas fa-exclamation-circle"></i>Error ${resp.status} al consultar GitHub.`);
                }
                return;
            }

            const datos = await resp.json();

            // Nos quedamos sólo con archivos PDF (no subcarpetas)
            const pdfs = datos
                .filter(item =>
                    item.type === 'file' &&
                    /\.pdf$/i.test(item.name)
                )
                .sort((a, b) =>
                    a.name.localeCompare(b.name, 'es', { numeric: true })
                );

            if (pdfs.length === 0) {
                mostrarEstado('<i class="fas fa-inbox"></i>No hay archivos PDF en esta carpeta.');
                return;
            }

            const html = pdfs.map(item => {
                const etiqueta = item.name.replace(/\.pdf$/i, '');
                return `
                    <div class="pdf-item">
                        <i class="fas fa-file-pdf"></i>
                        <a href="${encodeURIComponent(item.name)}"
                           target="_blank" rel="noopener">${etiqueta}</a>
                    </div>
                `;
            }).join('');

            document.getElementById('listaPDFs').innerHTML = html;

        } catch (err) {
            console.error(err);
            mostrarEstado('<i class="fas fa-wifi"></i>No se pudo conectar con GitHub para listar los archivos.');
        }
    }

    document.addEventListener('DOMContentLoaded', cargarPDFs);
})();
</script>
</body>
</html>
